name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify the tag matches package.json
        run: |
          node -e "const p = require('./package.json'); const expected = 'v' + p.version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('tag ' + process.env.GITHUB_REF_NAME + ' does not match ' + expected); process.exit(1) }"

      - name: Rebuild, check and pack
        run: npm run check

      - name: The committed bundle must match its sources
        run: git diff --exit-code -- client.js

      - name: Publish with trusted publishing
        run: npm publish
