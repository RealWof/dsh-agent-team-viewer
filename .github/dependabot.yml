# The plugin has no runtime or development dependencies yet, so only the
# GitHub Actions pins need watching. Add an npm entry if dependencies appear.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Monthly runs on the first day of each month; no timezone means UTC,
      # so the repository does not carry a maintainer's local zone.
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
      include: scope
    groups:
      actions:
        patterns:
          - "*"
